<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Habit Tracker{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Habit Tracker
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/habitos/">
                        Hábitos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/registros/">
                        Registros
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/estadisticas_global/">
                        Estadísticas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/exportar/json/">
                        Exportar JSON
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/importar/json/">
                        Importar JSON
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav">

                {% if user.is_authenticated %}

                    <li class="nav-item">

                        <span class="navbar-text me-3">
                            Hola, {{ user.username }}
                        </span>

                    </li>

                    <li class="nav-item">

                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}

                            <button class="btn btn-danger btn-sm">
                                Logout
                            </button>

                        </form>

                    </li>

                {% else %}

                    <li class="nav-item me-2">

                        <a class="btn btn-outline-light btn-sm"
                           href="{% url 'login' %}">

                            Login

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="btn btn-success btn-sm"
                           href="{% url 'registro_usuario' %}">

                            Registrarse

                        </a>

                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
